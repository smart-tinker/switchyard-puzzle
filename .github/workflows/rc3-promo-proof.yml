name: RC3 private promo proof
on:
  push:
    branches: [qa/rc3-promo-review]
    paths: ['.github/workflows/rc3-promo-proof.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e40281e39556be802b48ebcc94b37909782c1c8
          persist-credentials: false
      - name: Regenerate previews from the exact verified game
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5e40281e39556be802b48ebcc94b37909782c1c8
          bash test/package.sh
          echo 'e34f7ff221f8177a0a44d3b7b174a63d17113089cc888eb46c5697d456b0407f  switchyard.zip' | sha256sum -c
          unzip -q switchyard-yandex.zip -d packed
          unzip -q switchyard.zip -d portable
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
          PROMO_DIR=promo node test/browser.mjs | grep -E '^(DAILY_REPLAY|PORTABLE_SMOKE|DESKTOP_AND_MOBILE_SMOKE|PROMO_SIX_PNG)_PASS$'
          (cd promo && zip -q ../promo.zip *.png)
      - name: Trace six previews from the regenerated PNGs
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 -c 'from PIL import Image'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
          fi
          /usr/bin/python3 - <<'PY'
          from io import BytesIO
          from zipfile import ZipFile
          from PIL import Image, ImageDraw
          data = [
            ('01-icon.png',(1024,1024)),('02-cover.png',(1920,1080)),
            ('03-campaign.png',(1280,720)),('04-track-switch.png',(1280,720)),
            ('05-daily-in-progress.png',(1280,720)),('06-daily-record.png',(1280,720)),
          ]
          with ZipFile('promo.zip') as z:
              assert sorted(z.namelist()) == sorted(n for n, _ in data)
              for row in range(3):
                  sheet = Image.new('RGB',(1080,410),'#09131e')
                  label = ImageDraw.Draw(sheet)
                  for col,(name,size) in enumerate(data[row*2:row*2+2]):
                      im = Image.open(BytesIO(z.read(name)))
                      assert im.format == 'PNG' and im.size == size
                      im = im.convert('RGB')
                      im.thumbnail((520,365),Image.Resampling.LANCZOS)
                      sheet.paste(im,(col*540+(540-im.width)//2,10))
                      label.text((col*540+12,389),name,fill='#ffffff')
                  sheet.save(f'proof-{row}.jpg',quality=74,optimize=True)
          PY
      - name: Seal the reviewer copy without publishing artwork
        run: |
          set -euo pipefail
          {
            printf '%s\n' '-----BEGIN CERTIFICATE-----'
            printf '%s\n' '' | fold -w64
            printf '%s\n' '-----END CERTIFICATE-----'
          } > review.crt
          openssl x509 -in review.crt -noout
          for n in 0 1 2; do
            openssl cms -encrypt -binary -aes-256-cbc -in "proof-$n.jpg" -outform DER -out "proof-$n.cms" review.crt
            echo "SWITCH_REVIEW_$n BEGIN"
            base64 -w160 "proof-$n.cms"
            printf '\n'
            echo "SWITCH_REVIEW_$n END"
          done
